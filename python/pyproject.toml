[project]
name = "hermes-protocol"
version = "4.2.0"
description = "Hermes Protocol Python Models - Auto-generated from JSON schemas"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hermes Protocol Team", email = "team@hermes-protocol.example.com"}
]
keywords = [
    "ai-agents",
    "multi-agent-system", 
    "agent-orchestration",
    "fintech",
    "banking",
    "compliance",
    "pydantic",
    "json-schema"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "pydantic>=2.14.0",
    "typing-extensions>=4.16.0",
    "annotated-types>=0.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=26.0.0",
    "isort>=8.0.0",
    "mypy>=1.10.0",
    "ruff>=0.6.0"
]

[project.urls]
Homepage = "https://github.com/DenisZakharov2/hermes-protocol-team"
Repository = "https://github.com/DenisZakharov2/hermes-protocol-team"
Issues = "https://github.com/DenisZakharov2/hermes-protocol-team/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_protocol*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  # directories
  \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.datamodel-code-generator]
input-file-type = "jsonschema"
output-model-type = "pydantic_v2.BaseModel"
use-standard-collections = true
field-constraints = true
allow-population-by-field-name = true
use-annotated = true
use-field-description = true
use-schema-description = true
use-title-as-name = true
collapse-root-models = true
target-python-version = "3.11"
