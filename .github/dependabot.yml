version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps(npm)"
    groups:
      devDependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # mermaid и markdownlint-cli2 — реальные devDependencies репозитория.
      # Мажорные версии mermaid пропускаются: 12.x уже пробовался и откатывался
      # из-за несовместимости с undici/Node. Рабочая версия — 11.17.2 (см. package.json).
      - dependency-name: "mermaid"
        versions: [">= 12.0.0"]
      - dependency-name: "markdownlint-cli2"
        versions: [">= 1.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
