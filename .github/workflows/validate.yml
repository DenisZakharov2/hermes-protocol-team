name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Актуальная ветка 22.x: jsdom и markdownlint-cli2 требуют Node >= 22.22.2
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: /tmp/npm-cache-${{ github.run_id }}

      - name: Validate JSON examples, Mermaid diagrams and Markdown
        run: npm run validate

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: /tmp/npm-cache-${{ github.run_id }}

      - name: Regenerate schema reference
        run: npm run generate:docs

      - name: Check that generated docs are up to date
        run: git diff --exit-code -- docs/schemas-reference.md
