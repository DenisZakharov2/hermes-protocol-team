name: validate

on:
  push:
  pull_request:
  pull_request_target:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: /tmp/npm-cache-${{ github.run_id }}

      - name: Validate JSON examples, Mermaid diagrams and Markdown
        run: npm run validate
