name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          # Актуальная ветка 22.x: jsdom и markdownlint-cli2 требуют Node >= 22.22.2
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON examples, Mermaid diagrams and Markdown
        run: npm run validate
        timeout-minutes: 10

      - name: Check SECURITY.md supported versions table
        run: |
          # Extract version from package.json
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          MINOR_VERSION="${PKG_VERSION%.*}.x"

          # Extract only the version support table from SECURITY.md
          # Table starts with "| Версия | Поддержка |" and ends at first empty line or non-table line
          TABLE=$(sed -n '/| Версия | Поддержка |/,/^[^|]/p' SECURITY.md | head -n -1)

          # Count ✅ Да rows in the extracted table only
          CHECK_COUNT=$(echo "$TABLE" | grep -c "✅ Да" || true)
          CHECK_COUNT=${CHECK_COUNT:-0}

          if [ "$CHECK_COUNT" -ne 1 ]; then
            echo "❌ SECURITY.md must have exactly one '✅ Да' row in version table, found $CHECK_COUNT"
            exit 1
          fi

          # Verify the ✅ Да row matches package.json minor version
          if ! echo "$TABLE" | grep -q "| $MINOR_VERSION | ✅ Да |"; then
            echo "❌ SECURITY.md '✅ Да' row must match package.json version ($MINOR_VERSION)"
            echo "$TABLE" | grep "✅ Да"
            exit 1
          fi

          echo "✅ SECURITY.md supported versions table is correct"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate schema reference
        run: npm run generate:docs

      - name: Check that generated docs are up to date
        run: git diff --exit-code -- docs/schemas-reference.md